# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Toàn bộ kết quả chạy thử và phút xem lại/làm lại được đánh dấu simulated.
#
# D1 · Cỡ mẫu với baseline 0,70; alpha 0,05; power 0,80; ICC 0,02
# a) Chia theo yêu cầu, MDE 5 điểm: 1.251 yêu cầu mỗi nhóm.
# b) Chia theo nhân viên, m=75: DE=2,48; 3.103 yêu cầu mỗi nhóm, cần 42 nhân viên mỗi nhóm, tổng 84 nên không đủ.
# c) 20 nhân viên mỗi nhóm: giới hạn mẫu hiệu dụng c/ICC=1.000, thấp hơn 1.251.
# d) 6 depot mỗi nhóm: giới hạn mẫu hiệu dụng c/ICC=300.
# e) MDE 6 điểm: 859 mẫu hiệu dụng mỗi nhóm; 20 nhân viên mỗi nhóm cần m=299 yêu cầu/người, DE=6,96.
#    Nếu hiệu ứng thật là 5 điểm, power tại cỡ mẫu này còn xấp xỉ 0,64.
#
# D2 · Tách được tác động
# 1. Đối chứng gồm 20 nhân viên chạy cùng tuần và cùng các depot với nhóm can thiệp.
# 2. Phân ngẫu nhiên bằng code, seed ghi trước, phân tầng theo depot.
# 3. Có nguy cơ chia sẻ gợi ý giữa nhân viên; giới hạn quyền truy cập theo staff_id và log lượt mở trợ lý.
# 4. Chốt chỉ số chính, MDE, luật dừng và ngày quyết định trước ngày bắt đầu.
# 5. Có đúng 20 cụm nhân viên mỗi nhánh.
#
# Đánh đổi: với 40 nhân viên không đủ lực thống kê cho MDE 5 điểm; chấp nhận MDE 6 điểm.
# Mở lại trong 7 ngày ở dữ liệu chạy thử là 4,25% toàn mẫu (51/1.200) và 3,97% trong phạm vi pilot.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "12 depot; chỉ noi_dia và hang_nang (0,22x và 0,69x so với 12.000 đ, simulated); loại quoc_te (1,88x) và doi_tac (0,85x)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
    stratify_by: "depot"
    randomization_seed: 20261201
  rollout: [0.10, 0.25, 0.50] # 4, 10, rồi 20 nhân viên can thiệp; 20 nhân viên đối chứng chạy đồng thời
  primary_metric:
    name: "dong_trong_24h_khong_mo_lai_7_ngay"
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    power_if_true_5_point_effect: 0.64
    n_per_arm: 859 # mẫu hiệu dụng, không phải số yêu cầu thô
    raw_requests_per_arm: 5980
    design_effect: 6.96
    clusters_per_arm: 20
    requests_per_staff_average: 299
  identifiability:
    concurrent_control: "20 nhân viên đối chứng làm cùng tuần và cùng depot với 20 nhân viên can thiệp."
    randomization: "Bốc thăm bằng code với seed 20261201, phân tầng theo depot trước khi bắt đầu."
    spillover_risk: "Nhân viên cùng depot có thể chia sẻ gợi ý; giới hạn truy cập theo staff_id và ghi log lượt mở trợ lý theo staff_id."
    predeclared: "Đăng ký trước chỉ số chính, MDE 0,06, luật dừng và ngày quyết định 2027-01-05."
    minimum_clusters: "20 nhân viên mỗi nhánh; tổng 40 nhân viên."
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm can thiệp cao hơn đối chứng ít nhất 2 điểm phần trăm hoặc vượt 6%, hoặc có ít nhất 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo."
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM thu hẹp pilot về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở rộng sang hang_nang."
    - "NẾU tỉ lệ nhân viên sửa hoặc bỏ gợi ý vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout tiếp theo."
  interim_looks: "Kiểm tra chỉ số an toàn hằng ngày; chỉ đọc chỉ số chính tại bước 50% sau khi đạt cỡ mẫu hiệu dụng đã định trước."
  rollback: "Giám đốc vận hành bấm cờ tắt; hiệu lực trong 30 phút; nhân viên xử lý yêu cầu theo luồng tự làm hiện tại."
  decision_date: "2027-01-05"
  simulated_inputs:
    - "baseline chỉ số chính 0,70; MDE 0,05 cần 1.251 yêu cầu mỗi nhánh; alpha 0,05; power 0,80"
    - "ICC 0,02; 40 nhân viên; 12 depot; trung bình m=75 yêu cầu mỗi nhân viên trong tính toán D1"
    - "MDE chấp nhận 0,06; 859 mẫu hiệu dụng mỗi nhánh; 20 cụm mỗi nhánh; m=299; design effect 6,96; power 0,64 nếu hiệu ứng thật là 0,05"
    - "Mở lại trong 7 ngày 4,25% toàn mẫu (51/1.200) và 3,97% trong phạm vi noi_dia cộng hang_nang"
    - "Chi phí mỗi việc thành công theo loại: noi_dia 0,22x; hang_nang 0,69x; quoc_te 1,88x; doi_tac 0,85x so với 12.000 đ"
    - "Chi phí xem lại và làm lại, cùng các kịch bản độ nhạy, lấy từ cột simulated trong dữ liệu lab"
